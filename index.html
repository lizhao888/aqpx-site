<!DOCTYPE html><html lang=zh-CN><head><meta charset=UTF-8><meta name=viewport content='width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no'><title>安全培训视频</title>
<style>*{margin:0;padding:0;box-sizing:border-box}body{font-family:-apple-system,BlinkMacSystemFont,'Microsoft YaHei',sans-serif;background:#0d1b2a;color:#e0e6ed;min-height:100vh;display:flex;flex-direction:column}.header{background:linear-gradient(135deg,#1b3a5c,#0f2440);padding:18px 16px;text-align:center;border-bottom:2px solid #2d6bb4}.header h1{font-size:20px;font-weight:700;color:#fff;margin-bottom:6px}.header .info{font-size:13px;color:#8ab4e0}.player{flex:1;display:flex;align-items:center;justify-content:center;background:#000}.player video{width:100%;max-height:70vh;outline:none}.footer{text-align:center;padding:24px 16px;background:linear-gradient(0deg,#0f2440,#0d1b2a)}.footer .slogan{font-size:17px;color:#f0c040;font-weight:700;letter-spacing:2px;margin-bottom:8px}.footer .slogan-sub{font-size:12px;color:#8ab4e0;letter-spacing:3px}.overlay{display:none;position:fixed;top:0;left:0;right:0;bottom:0;background:rgba(13,27,42,0.96);z-index:100;flex-direction:column;align-items:center;justify-content:center}.overlay.show{display:flex}.overlay .check{width:88px;height:88px;border-radius:50%;background:#27ae60;display:flex;align-items:center;justify-content:center;margin-bottom:28px;animation:popIn .5s cubic-bezier(.68,-.55,.27,1.55)}.overlay .check svg{width:48px;height:48px;fill:#fff}.overlay h2{font-size:24px;color:#27ae60;font-weight:700;margin-bottom:10px}.overlay p{font-size:15px;color:#8ab4e0}.overlay button{margin-top:32px;padding:14px 48px;background:#2d6bb4;color:#fff;border:none;border-radius:10px;font-size:17px;font-weight:600;cursor:pointer}@keyframes popIn{0%{transform:scale(0);opacity:0}70%{transform:scale(1.08)}100%{transform:scale(1);opacity:1}}</style></head><body>
<div class=header><h1>安全培训视频</h1><div class=info>扫码观看培训内容</div></div>
<div class=player><video id=v controls playsinline webkit-playsinline x5-video-player-type=h5 x5-video-player-fullscreen=true x5-video-orientation=portrait controlsList=nodownload preload=metadata><source src=video.mp4 type=video/mp4></video></div>
<div class=footer><div class=slogan>人人讲安全 个个会应急</div><div class=slogan-sub>—— 排查整治风险隐患 ——</div></div>
<div class=overlay id=done><div class=check><svg viewBox='0 0 24 24'><path d='M9 16.17L4.83 12l-1.42 1.41L9 19 21 7l-1.41-1.41z'/></svg></div><h2>观看完成</h2><p>您已完成本次安全培训学习</p><button onclick='location.reload()'>重新观看</button></div>
<script>var v=document.getElementById('v'),f=0,lt=0,fp='fp_'+(navigator.hardwareConcurrency||1)+'_'+Math.random().toString(36).slice(2,10)+'_'+Date.now();v.addEventListener('timeupdate',function(){if(!f&&v.currentTime>2){f=1;fetch('https://aq-train.trainingvids.workers.dev/log',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({fp:fp})})}lt=v.currentTime});v.addEventListener('ended',function(){document.getElementById('done').classList.add('show')});v.addEventListener('seeking',function(){if(v.currentTime>lt+5)v.currentTime=lt});v.addEventListener('seeked',function(){lt=v.currentTime})</script></body></html>
